<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="shell">
    <h1 class="title">TETRIS</h1>

    <div class="layout">
      <canvas id="board" class="board" width="300" height="600" aria-label="Tetris board"></canvas>

      <aside class="sidebar">
        <section class="panel">
          <h2>Next</h2>
          <canvas id="next" class="preview" width="120" height="120" aria-label="Next piece"></canvas>
        </section>

        <section class="panel">
          <h2>Status</h2>
          <div class="hud">
            <div class="hud-row"><span>Score</span><span id="score">0</span></div>
            <div class="hud-row"><span>Level</span><span id="level">1</span></div>
            <div class="hud-row"><span>Lines</span><span id="lines">0</span></div>
          </div>
        </section>

        <section class="panel">
          <h2>Controls</h2>
          <ul class="controls">
            <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> Move</li>
            <li><kbd>&darr;</kbd> Soft drop</li>
            <li><kbd>&uarr;</kbd> Rotate</li>
            <li><kbd>Space</kbd> Hard drop</li>
            <li><kbd>P</kbd> Pause</li>
            <li><kbd>R</kbd> Restart</li>
          </ul>
        </section>
      </aside>
    </div>
  </main>

  <!-- Load order matters: constants -> board -> piece -> game -> renderer -> input -> main.
       Classic scripts only (no ES modules) so the page works from file://. -->
  <script src="js/constants.js"></script>
  <script src="js/board.js"></script>
  <script src="js/piece.js"></script>
  <script src="js/game.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
